name: Semgrep

on:
  push:
    branches: [ "manin" ] # 1. Fixed "manin" to "main"
  pull_request:
    branches: [ "manin" ] # 1. Fixed "manin" to "main"
  workflow_dispatch: {}    # 2. Added this so the "Run workflow" button appears

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep CI Scan
        # 3. Updated to @v1 for the modern stable version
        uses: returntocorp/semgrep-action@v1 
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          # 4. REMOVED publishDeployment line. 
          # This was the cause of your "URL not found" error.
          generateSarif: "1"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
